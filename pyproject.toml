[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envdesk"
version = "0.1.0.dev0"
description = "Project scaffold for a Python environment troubleshooting agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["envdesk*"]
